<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto</title>
    <link rel="stylesheet" href="./css/product-create.css">
</head>

<body>
    <header>
        <h1 class="titleIndex">StickerMania</h1>
        <p>¡Decora tu vida con nuestros stickers únicos!</p>
    </header>

    <h2>Nuevo Producto</h2>

    <form id="formProducto" enctype="multipart/form-data">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="slug">Slug</label>
        <input type="text" id="slug" name="slug" required>

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" required></textarea>

        <label for="precio">Precio</label>
        <input type="number" id="precio" name="precio" min="0" step="0.01" required>

        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria" required>
            <option value="">Seleccione una categoría</option>
        </select>

        <label for="etiquetas">Etiquetas (separadas por comas)</label>
        <input type="text" id="etiquetas" placeholder="Marvel, Avengers, Comics">

        <label for="imagen">Imagen</label>
        <input type="file" id="imagen" name="imagen" accept="image/*">

        <button type="submit">Crear producto</button>
    </form>

    <p>
        <a class="volver" href="product.html">Volver al catálogo</a>
    </p>

    <script type="module" src="/js/product-create.js"></script>
</body>

</html>
