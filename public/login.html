<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StickerMania</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <header>
        <h1 class="titleIndex">StickerMania</h1>
        <p>¡Decora tu vida con nuestros stickers únicos!</p>
    </header>

    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required>

        <label for="clave">Contraseña</label>
        <input type="password" id="clave" required>

        <button type="submit" id="boton">Ingresar</button>
    </form>
    
    <a class="volver" href="index.html">Volver al Inicio</a>

    <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>

    <script type="module" src="/js/login.js"></script>
</body>

</html>
