<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - StickerMania</title>
    <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/product.css">
</head>

<body>
    <header>
        <h1 class="titleIndex">StickerMania</h1>

        <div class="buttonNavContainer">
            <button id="abrir" class="buttonNav" aria-label="Abrir menú">
                <i class='bxr bx-menu' style="font-size:2.5rem;color:white;"></i>
            </button>
        </div>

        <nav class="main-nav" id="nav" aria-label="Menú principal">
            <div class="buttonNavContainerX">
                <button id="cerrar" class="buttonNavX" aria-label="Cerrar menú">
                    <i class='bxr  bx-x' style="font-size: 2.5rem;color:white;"></i>
                </button>
            </div>
            <a href="index.html">Inicio</a>
            <a href="cart.html">Carrito</a>
            <a href="login.html" id="loginLink">Login</a>
            <a href="register.html" id="registerLink">Registro</a>
            <a href="#" id="logoutLink" hidden>Cerrar sesión</a>
            <div id="adminMenu" hidden>
                <a href="product-create.html">Nuevo producto</a>
            </div>
        </nav>
    </header>
    
    <main>
        <h2>Catálogo</h2>
        <label for="busqueda">Buscar</label>
        <input type="search" id="busqueda" placeholder="Buscar producto...">

        <label for="categoria">Categoría</label>
        <select id="categoria">
            <option value="todas">Todas</option>
        </select>

        <section id="productos" aria-label="Listado de productos"></section>
    </main>

    <footer>
        <p>StickerMania © 2025</p>
    </footer>

    <script type="module" src="/js/product.js"></script>
</body>

</html>
