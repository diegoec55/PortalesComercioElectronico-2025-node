<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - StickerMania</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/register.css">
</head>

<body>
    <header>
        <h1 class="titleIndex">StickerMania</h1>
        <p>¡Decora tu vida con nuestros stickers únicos!</p>
    </header>

    <main>
        <h2 id="tituloFormulario">Crear una cuenta</h2>
        <form id="registroForm">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" autocomplete="name" aria-required="true" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" autocomplete="email" aria-required="true" required>

            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" autocomplete="new-password" minlength="8">
            <p id="ayudaClave">
                La contraseña debe tener al menos 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial.
            </p>

            <button type="submit" id="btnGuardar">Registrarse</button>
        </form>

        <p>
            <a id="volverLink" href="index.html">Volver al inicio</a>
        </p>
    </main>

    <footer>
        <p>StickerMania. Proyecto INA 2025.</p>
    </footer>

    <script type="module" src="/js/register.js"></script>
</body>
</html>
